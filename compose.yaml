name: cloudlab-recovery
services:
  app:
    build: ./app
    restart: unless-stopped
    init: true
    environment:
      LAB_SECRET: ${LAB_SECRET}
      LAB_PASSWORD: ${LAB_PASSWORD}
      POSTGRES_USER: cloudlab
      POSTGRES_DB: cloudlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTO_BACKUP_SECONDS: 300
    ports:
      - '0.0.0.0:8080:8080'
    volumes:
      - app-data:/data
      - ./certs:/app/certs:ro
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-recovery:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    pids_limit: 200
    healthcheck:
      test: ['CMD','python','-c','import urllib.request;urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=4)']
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 40s

  pg-primary:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudlab
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U cloudlab -d cloudlab']
      interval: 8s
      timeout: 5s
      retries: 12
    security_opt: ['no-new-privileges:true']

  pg-recovery:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudlab
    volumes:
      - pg-recovery-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U cloudlab -d cloudlab']
      interval: 8s
      timeout: 5s
      retries: 12
    security_opt: ['no-new-privileges:true']

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ['sh','-c','exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL','redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ['no-new-privileges:true']

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    security_opt: ['no-new-privileges:true']

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - '0.0.0.0:3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ALLOW_EMBEDDING: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudlab-command.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    security_opt: ['no-new-privileges:true']

  pg-exporter-primary:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://cloudlab:${POSTGRES_PASSWORD}@pg-primary:5432/cloudlab?sslmode=disable'
    depends_on:
      pg-primary:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']

  pg-exporter-recovery:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://cloudlab:${POSTGRES_PASSWORD}@pg-recovery:5432/cloudlab?sslmode=disable'
    depends_on:
      pg-recovery:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: 'redis://redis:6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    command: ['--path.rootfs=/host']
    security_opt: ['no-new-privileges:true']

volumes:
  app-data:
  pg-primary-data:
  pg-recovery-data:
  redis-data:
  prometheus-data:
  grafana-data:
