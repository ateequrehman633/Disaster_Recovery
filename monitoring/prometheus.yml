global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: cloudlab-app
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8080']
  - job_name: postgres-primary
    static_configs:
      - targets: ['pg-exporter-primary:9187']
  - job_name: postgres-recovery
    static_configs:
      - targets: ['pg-exporter-recovery:9187']
  - job_name: redis-local
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: ecs-host
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
